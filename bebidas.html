<!doctype html>
<html lang="pt-BR">
  <head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaffee Für Alle - Bebidas Especiais</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800&family=Quicksand:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/cardapios.css" />
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/components/modal.css" />
  </head>
  
  <body data-categoria-pagina="bebidas">
    <button class="botao-voltar" aria-label="Voltar ao menu central">
      &lt;
    </button>

    <div class="pagina-cardapio">
      <div class="grade-cardapio">
        <div class="coluna-cardapio">
          <div class="abas">
            <button class="aba-btn ativo" data-aba="lactose">
              Sem Lactose
            </button>
            <button class="aba-btn" data-aba="fodmaps">Low FODMAP</button>
            <button class="aba-btn" data-aba="cafeina">Sem Cafeína</button>
            <button class="aba-btn" data-aba="gluten">Sem Glúten</button>
          </div>

          

          <h2 class="titulo-subcategoria">Bebidas Tradicionais</h2>
          <div id="bebidas-quentes" id="bebidas-geladas"></div>
        </div>

        <div class="coluna-cardapio">
          <h2>Bebidas Especiais</h2>

          <div class="abas">
            <button class="aba-btn ativo" data-aba="classicos">
              Clássicos
            </button>
            <button class="aba-btn" data-aba="alcoholicos">Alcoólicos</button>
            <button class="aba-btn" data-aba="semcafeina-especiais">
              Sem Cafeína
            </button>
          </div>

          <div id="bebidas-especiais"></div>

          <a class="link-subcategoria" href="refrigerantes.html"
            >Ver refrigerantes</a
          >
        </div>
      </div>
    </div>

    
    <div class="sobreposicao-modal" id="modalOverlay"></div>
    <div class="caixa-modal" id="produtoModal">
      <button class="botao-fechar-modal" id="btnFecharModal">&times;</button>
      <div class="container-img-modal">
        <img
          id="modalImg"
          src="https://images.unsplash.com/photo-12956425/pexels-photo-12956425.jpeg"
          alt="Produto"
        />
      </div>
      <div class="info-modal">
        <h2 id="modalNome"></h2>
        <p id="modalDesc"></p>
        <span class="preco-modal" id="modalPreco"></span>
        <button class="botao-adicionar" id="btnAdd">
          ADICIONAR AO CARRINHO
        </button>
      </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/modals/supabaseConfig.js"></script>
    <script src="../js/cardapio-base.js"></script>
    <script src="../js/modals/cart-store.js"></script>
    <script src="../js/modals/app-auth.js"></script>
  </body>
</html>
