<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favoritos • Kaffee Für Alle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    

    <link rel="stylesheet" href="../css/favoritos.css" />
    <link rel="stylesheet" href="../css/icons.css">
  </head>
  <body>
    

    <div class="overlay-escura" aria-hidden="true"></div>

    <main class="pagina-favoritos">
      
      <header class="cabecalho-do-perfil">
        <div class="informacoes-do-usuario">
          <div class="avatar-do-usuario">
            <img
              id="imagem-do-usuario"
              src="../assets/icons/user.svg"
              alt="Perfil"
            />
          </div>

          <div class="dados-do-usuario">
            <span class="saudacao-do-usuario">Olá,</span>

            
            <h2 id="nome-do-usuario-logado">Usuário</h2>

            <span class="status-do-usuario">Perfil conectado</span>

            <button
              class="editar-perfil"
              id="botao-editar-perfil"
              type="button"
            >
              Editar perfil
            </button>
          </div>
        </div>

        <div
          class="contador-de-favoritos"
          aria-label="Quantidade de produtos favoritos"
          aria-live="polite"
        >
          <img class="icono-ui" src="../assets/icons/heart.svg" alt="" aria-hidden="true">

          <span id="quantidade-total-de-favoritos">1</span>
        </div>
      </header>

      

      <section class="titulo-da-pagina">
        <h1>PRODUTOS FAVORITOS</h1>

        <p>Seus cafés e doces favoritos</p>
      </section>

      

      <form class="form" id="formulario-pesquisa">
        <label for="campo-de-pesquisa">
          <input
            class="input"
            id="campo-de-pesquisa"
            type="search"
            required
            placeholder="Pesquisar favoritos..."
            autocomplete="off"
          />
          <div class="fancy-bg"></div>
          <span class="search" aria-hidden="true">
            <img class="icono-ui" src="../assets/icons/search.svg" alt="" aria-hidden="true">
          </span>
          <button
            class="close-btn"
            id="botao-de-limpar-pesquisa"
            type="reset"
            aria-label="Limpar pesquisa"
          >
            <img class="icono-ui" src="../assets/icons/close.svg" alt="" aria-hidden="true">
          </button>
        </label>
      </form>

      

      <section class="container-dos-filtros">
        <button class="btn-23 chip ativo" data-categoria="todos">
          <span class="text">Todos</span>
          <span aria-hidden="true" class="marquee">Todos</span>
        </button>

        <button class="btn-23 chip" data-categoria="bebidas">
          <span class="text">Bebidas</span>
          <span aria-hidden="true" class="marquee">Bebidas</span>
        </button>

        <button class="btn-23 chip" data-categoria="doces">
          <span class="text">Doces</span>
          <span aria-hidden="true" class="marquee">Doces</span>
        </button>

        <button class="btn-23 chip" data-categoria="paes">
          <span class="text">Pães</span>
          <span aria-hidden="true" class="marquee">Pães</span>
        </button>

        <button class="btn-23 chip" data-categoria="refrigerantes">
          <span class="text">Refrigerantes</span>
          <span aria-hidden="true" class="marquee">Refrigerantes</span>
        </button>

        <button class="btn-23 chip" data-categoria="salgados">
          <span class="text">Salgados</span>
          <span aria-hidden="true" class="marquee">Salgados</span>
        </button>
      </section>
      

      <section class="secao-do-carrossel">
        <button
          id="anterior"
          class="seta"
          type="button"
          aria-label="Produto anterior"
        >
          <img class="icono-ui" src="../assets/icons/arrow-left.svg" alt="" aria-hidden="true">
        </button>

        <div id="carrossel" class="lista-de-produtos">
          
          <article
            class="card carregando"
            data-categoria="bebidas"
            data-produto-id="001"
          >
            
            <div class="controle-coracao">
              <input
                id="toggle-heart-001"
                class="toggle-heart"
                type="checkbox"
                checked
              />
              <label
                for="toggle-heart-001"
                class="heart-label"
                aria-label="Remover Café Especial dos favoritos"
                ><img class="icono-ui" src="../assets/icons/heart-filled.svg" alt="" aria-hidden="true"></label
              >
            </div>

            <img
              src="../img/excafe.png"
              alt="Café Especial"
              loading="lazy"
            />

            <span class="categoria">CAFÉ</span>

            <h3>Café Especial</h3>

            <div class="estrelas" aria-label="Avaliação: 5 de 5">5/5</div>

            <strong>R$ 12,90</strong>

            <button class="ver-detalhes" type="button">Ver detalhes</button>
          </article>
        </div>

        <button
          id="proximo"
          class="seta"
          type="button"
          aria-label="Próximo produto"
        >
          <img class="icono-ui" src="../assets/icons/arrow-right.svg" alt="" aria-hidden="true">
        </button>
      </section>

      <div class="indicadores">
        <span class="dot ativo"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      

      <section class="jornais">
        <div class="titulo-secao">
          <h2>JORNAIS FAVORITOS</h2>

          <button type="button">Ver todos</button>
        </div>

        <article class="jornal">
          <img
            src="../logs/000.png"
            alt="Jornal Gazeta"
            loading="lazy"
          />

          <div>
            <h3>Gazeta</h3>
            <p>14 Setembro 2026</p>
          </div>

          <button
            class="ler jornal-favorito"
            id="botao-remover-jornal"
            type="button"
            aria-label="Remover Gazeta dos jornais favoritos"
            aria-pressed="true"
          >
            <span class="plusButton" aria-hidden="true">
              <img class="icono-ui" src="../assets/icons/plus.svg" alt="" aria-hidden="true">
            </span>
          </button>
        </article>
      </section>
    </main>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    

    <dialog id="modal-produto">
      <button
        id="fechar-modal"
        type="button"
        aria-label="Fechar detalhes do produto"
      >
        <img class="icono-ui" src="../assets/icons/close.svg" alt="" aria-hidden="true">
      </button>

      <img
        src="../img/excafe.png"
        alt="Imagem do Café Especial"
        loading="lazy"
      />

      <span>CAFÉ</span>

      <h2>Café Especial</h2>

      <p>Grãos 100% arábica selecionados.</p>

      <h3>R$ 12,90</h3>

      <button class="comprar" type="button">Adicionar ao carrinho</button>
    </dialog>

    <dialog id="modal-perfil" class="modal-perfil">
      <form id="formulario-perfil" method="dialog">
        <button
          class="fechar-modal"
          id="fechar-modal-perfil"
          type="button"
          aria-label="Fechar edição do perfil"
        >
          ×
        </button>

        <h2>Editar perfil</h2>

        <label for="campo-nome-perfil">Nome</label>
        <input id="campo-nome-perfil" name="nome" type="text" required />

        <label for="campo-foto-perfil">URL da foto</label>
        <input id="campo-foto-perfil" name="foto" type="url" />

        <button class="comprar" type="submit">Salvar perfil</button>
      </form>
    </dialog>

    <script src="js/favoritos.js"></script>
  </body>
</html>
