<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaffee Für Alle - Doces</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;800&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/mainp.css">
  <link rel="stylesheet" href="css/cardapios.css">
  <link rel="stylesheet" href="css/components/modal.css">
</head>
<body>

  <button class="botao-voltar" onclick="window.location.href='../cardapio.html'" aria-label="Voltar ao menu central">
    &lt;
  </button>

  <div class="pagina-cardapio">
    
    <div class="grade-cardapio">
      
      <div class="coluna-cardapio">
        <h2>Doces Regulares</h2>
        <div id="doces-regulares"></div>

        <h2 style="margin-top: 40px;">Doces Frios</h2>
        <div id="doces-frios"></div>
      </div>

      <div class="coluna-cardapio">
        <h2>Doces Especiais</h2>
        
        <div class="abas">
          <button class="aba-btn ativo" data-aba="lactose">Sem Lactose</button>
          <button class="aba-btn" data-aba="fodmaps">Low FODMAP</button>
          <button class="aba-btn" data-aba="cafeina">Sem Cafeína</button>
          <button class="aba-btn" data-aba="gluten">Sem Glúten</button>
        </div>
        
        <div id="doces-especiais"></div>
      </div>
    </div>

  </div>

  <!-- Modal -->
  <div class="sobreposicao-modal" id="modalOverlay"></div>
  <div class="caixa-modal" id="produtoModal">
    <button class="botao-fechar-modal" id="btnFecharModal">&times;</button>
    <div class="container-img-modal">
      <img id="modalImg" src="https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=500" alt="Produto">
    </div>
    <div class="info-modal">
      <h2 id="modalNome"></h2>
      <p id="modalDesc"></p>
      <span class="preco-modal" id="modalPreco"></span>
      <button class="botao-adicionar" id="btnAdd">ADICIONAR AO CARRINHO</button>
    </div>
  </div>
  <!-- SCRIPTS - Removido modals.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClientep.js"></script>
  <script src="js/CardapioPag/doces.js"></script>
</body>
</html>
